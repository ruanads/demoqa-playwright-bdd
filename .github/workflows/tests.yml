name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

# Princípio do menor privilégio: o workflow só precisa ler o código.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npm test
      # Bugs conhecidos rodam separados, com relatórios próprios em relatorios/bugs.
      - run: npm run test:bugs
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: relatorios/
          retention-days: 14
